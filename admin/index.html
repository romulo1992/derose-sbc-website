<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Blog</title>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>Blog Admin</h1>
      <input id="search" type="search" placeholder="Buscar posts..." aria-label="Buscar posts" />
      <ul id="postList" class="post-list" aria-label="Lista de posts"></ul>
      <button id="newPostBtn" type="button">Novo post</button>
    </aside>

    <main class="editor">
      <header class="editor-header">
        <h2 id="editorTitle">Selecione um post</h2>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </header>

      <form id="postForm" class="form" autocomplete="off">
        <fieldset>
          <legend>Metadata</legend>
          <label>Slug (Identificador Único do Link do Post) <input name="slug" required pattern="^[a-z0-9-]+$" /></label>
          <label>Título <input name="title" /></label>
          <label>Resumo <textarea name="excerpt" rows="4"></textarea></label>
          <label>Categoria <input name="category" /></label>
          <label>Tags (separadas por vírgula) <input name="tags" /></label>
          <label>Data <input name="date" type="date" /></label>
          <label>Tempo de Leitura <input name="readMin" type="number" min="1" step="1" placeholder="(opcional)" /></label>
          <label class="checkbox"><input name="featured" type="checkbox" /> Destaque</label>
          <label>image <input name="image" placeholder="/assets/blog/featured.webp" /></label>
        </fieldset>

        <fieldset>
          <legend>Conteúdo da página</legend>
          <div class="content-groups">
            <section class="content-group group-hero">
              <h3>Hero</h3>
              <label>Imagem de Capa <input name="coverImage" placeholder="/assets/blog/..." /></label>
            </section>

            <section class="content-group group-content-1">
              <h3>Content Part 1</h3>
              <label>Conteúdo Parte 1 (Utilizar Markdown Para Formatação) <textarea name="content1_markdown" rows="24"></textarea></label>
            </section>

            <section class="content-group group-cta-1">
              <h3>CTA 1</h3>
              <label>Título do CTA 1 <input name="cta1_headline" /></label>
              <label>Subtítulo do CTA 1 <input name="cta1_subheadline" /></label>
              <label>Texto do Primeiro Botão do CTA 1 <input name="cta1_primary_label" /></label>
              <label>Link do Primeiro Botão do CTA 1 <input name="cta1_primary_href" /></label>
              <label>Texto do Segundo Botão do CTA 1 <input name="cta1_secondary_label" /></label>
              <label>Link do Segundo Botão do CTA 1 <input name="cta1_secondary_href" /></label>
            </section>

            <section class="content-group group-content-2">
              <h3>Content Part 2</h3>
              <label>Conteúdo Parte 2 (Utilizar Markdown Para Formatação) <textarea name="content2_markdown" rows="24"></textarea></label>
            </section>

            <section class="content-group group-cta-2">
              <h3>CTA 2</h3>
              <label>Título do CTA 2 <input name="cta2_headline" /></label>
              <label>Subtítulo do CTA 2 <input name="cta2_subheadline" /></label>
              <label>Texto do Primeiro Botão do CTA 2 <input name="cta2_primary_label" /></label>
              <label>Link do Primeiro Botão do CTA 2 <input name="cta2_primary_href" /></label>
              <label>Texto do Segundo Botão do CTA 2 <input name="cta2_secondary_label" /></label>
              <label>Link do Segundo Botão do CTA 2 <input name="cta2_secondary_href" /></label>
            </section>
          </div>
        </fieldset>

        <div class="actions">
          <button id="saveBtn" type="submit">Salvar</button>
          <button id="deleteBtn" type="button" class="danger">Excluir</button>
        </div>
      </form>
    </main>
  </div>

  <script src="./app.js" type="module"></script>
</body>
</html>
